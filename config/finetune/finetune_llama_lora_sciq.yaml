mode: finetune
finetune_choice: lora

pretrain_config:
  model_choice: llama

  data: 
    id: "Ankursingh/openwebtext_10K" 
    cache_dir: "/content/cache"
    tokenizer: "NousResearch/Llama-2-7b-hf"
    stream: false

  model:
    type: llama
    hidden_dim: 576
    intermediate_dim: 2304
    num_heads: 12
    num_layers: 12
    seq_len: 512

  trainer:
    id: "62t179nh"
    wandb:
      name: "nano_llama"
      project: "qkvflow"
    checkpointer:
      base_path: "/content/drive/MyDrive/nano_llama_checkpoints/"

  optimizer:
    learning_rate: 4E-4 
    beta2: 0.95
    weight_decay: 1e-5

finetune_data:
  id: "sciq"
  cache_dir: "/content/cache/sciq"
  tokenizer: "NousResearch/Llama-2-7b-hf"
  text_key: 'question' 

finetuner:
  wandb:
    name: "nano_llama_lora_on_sciq"
    project: "qkvflow"
    tags: ["finetune", "lora", "sciq"]

  mp: p=f32,c=bfloat16
  train_batch_size: 8 
  num_train_steps: 3001
  steps_per_eval: 50
  
  checkpointer: 
    save_interval: 10min 
    keep:
      - every: 500
        until: 3001
    base_path: "/content/drive/MyDrive/lora_finetuned_checkpoints/"

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - "self_attn.*_proj"
    - "mlp.*_proj"


lora_optimizer:
  learning_rate: 3.0e-4
  weight_decay: 0.01
  min_lr_ratio: 0.1
  beta1: 0.9
  beta2: 0.99