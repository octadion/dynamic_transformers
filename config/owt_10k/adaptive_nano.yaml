model_choice: "svd_neuralode"

data: 
  id: "Ankursingh/openwebtext_10K"
  cache_dir: "/tmp/cache"
  stream: false
  val_ratio: 0.001
  text_key: "text"

model:
  type: gpt2
  hidden_dim: 768
  num_heads: 12
  num_layers: 12
  seq_len: 512
  embed_pdrop: 0.1
  resid_pdrop: 0.1
  attn_pdrop: 0.1
  use_flash_attention: true
  layer_norm_epsilon: 1e-5
  use_bias: true

# SVD Neural ODE specific configuration
svd_ode:
  # SVD parameters
  rank: 64
  num_experts: 4
  expert_init_scale: 0.05
  
  # Policy parameters
  use_adaptive_mixing: true
  policy_learning_rate: 1e-4
  entropy_coeff: 0.01
  value_loss_coeff: 0.5
  
  # Training parameters
  policy_update_frequency: 10
  warmup_steps: 1000
  expert_diversity_bonus: 0.1

# Neural ODE parameters
time_embed_dim: 128
sinusodial_dim: 32
num_check_points: 4
rank: 8
alpha: 1.0
num_blocks: 4
multiplier: 2

trainer:
  wandb:
    name: "svd_neuralode_experiment"
    project: "qkvflow_svd"
    tags: ["svd", "neuralode", "adaptive"]
  
  mp: "p=f32,c=bfloat16"
  per_device_eval_parallelism: 1
  per_device_parallelism: 1
  train_batch_size: 8
  num_train_steps: 10000
  steps_per_eval: 100
  
  tensor_parallel_axes: ["mlp", "heads"]
  fsdp_axis: "embed"
  batch_axis: "batch"
  
  checkpointer: 
    save_interval: "30min"
    keep:
      - every: 1000
        until: 10000
    base_path: "./checkpoints/svd_neuralode/"

optimizer:
  learning_rate: 3e-4
  weight_decay: 0.01
  min_lr_ratio: 0.1
  beta1: 0.9
  beta2: 0.999
  epsilon: 1e-8
  max_grad_norm: 1.0

# Analysis settings
analysis_frequency: 500
save_expert_analysis: true
log_parameter_norms: true