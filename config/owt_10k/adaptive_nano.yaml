data: 
  id: "Ankursingh/openwebtext_10K" 
  cache_dir: "/content/cache"
  stream: false

model:
  type: gpt2
  hidden_dim: 576
  num_heads: 12  
  num_layers: 12  
  seq_len: 512 
  embed_pdrop: 0.1
  resid_pdrop: 0.1
  attn_pdrop: 0.1

trainer:
  wandb:
    name: "adaptive_nano_gpt2"
    project: "qkvflow"
    tags: ["ankursingh", "nano", "gpt2", "adaptive", "svd"]
  
  mp: p=f32,c=bfloat16
  per_device_eval_parallelism: 1
  per_device_parallelism: 1
  train_batch_size: 8     
  num_train_steps: 5001 
  steps_per_eval: 100   
  
  tensor_parallel_axes: ["mlp", "heads"]
  fsdp_axis: "embed"
  batch_axis: "batch"
  
  checkpointer: 
    save_interval: 45min 
    keep:
      - every: 1000 
        until: 5001
    base_path: "/content/drive/MyDrive/adaptive_nano_gpt2_checkpoints/"

optimizer:
  learning_rate: 3E-4 
  weight_decay: 0.08
  min_lr_ratio: 0.1

model_choice: adaptive_neuralode
time_embed_dim: 64 
sinusodial_dim: 32
num_experts: 4

expert_types: ["general", "math", "code", "reasoning"]
use_difficulty_adaptation: true
use_task_prediction: true
use_expert_loss: true
expert_loss_weight: 0.1
diversity_loss_weight: 0.05

